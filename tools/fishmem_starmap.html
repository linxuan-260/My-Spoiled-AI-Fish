<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>肥鱼 · 记忆星图</title>
<style>
  :root{
    --fg:#cfe0f5; --dim:#5d7590; --dim2:#3b4c60;
    --line:rgba(110,150,200,.14); --accent:#6fc3ff;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#03050a;overflow:hidden;color:var(--fg);
    font:13px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  canvas#sky{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab}
  canvas#sky.drag{cursor:grabbing}

  #hud{position:fixed;left:24px;top:20px;z-index:6;pointer-events:none;
       text-shadow:0 1px 12px #03050a}
  .brand{display:flex;align-items:baseline;gap:10px;font-size:15px;letter-spacing:3px;
         font-weight:600;color:#e8f2ff}
  .brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);
           box-shadow:0 0 10px var(--accent),0 0 22px rgba(111,195,255,.6);
           transform:translateY(-1px);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45;transform:translateY(-1px) scale(.85)}
                   50%{opacity:1;transform:translateY(-1px) scale(1.15)}}
  .brand small{font:11px/1 var(--mono);letter-spacing:1px;color:var(--dim);font-weight:400}
  .stats{margin-top:9px;font:11px/1.9 var(--mono);color:var(--dim);letter-spacing:.4px;
         display:flex;gap:16px;flex-wrap:wrap}
  .stats b{color:#dceafc;font-weight:600;font-size:13px}
  .stats b.c{color:var(--accent)}

  #legend{margin-top:16px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
  .lg{display:flex;align-items:center;gap:8px;font:11px/1 var(--mono);letter-spacing:.5px;
      color:var(--dim);cursor:pointer;user-select:none;transition:opacity .18s,color .18s;
      padding:2px 0;width:118px}
  .lg:hover{color:var(--fg)}
  .lg.off{opacity:.3}
  .lg u{width:9px;height:9px;border-radius:50%;display:inline-block;text-decoration:none;
        box-shadow:0 0 9px currentColor;background:currentColor;flex:none}
  .lg s{text-decoration:none;color:inherit;flex:1}
  .lg em{font-style:normal;color:var(--dim2);font-size:10px}
  .lg.hr{margin-top:9px;padding-top:8px;border-top:1px solid rgba(110,150,200,.10)}

  #ctrl{position:fixed;right:20px;top:18px;z-index:7;display:flex;gap:8px;align-items:center}
  #q{width:200px;background:rgba(9,14,23,.86);border:1px solid var(--line);border-radius:9px;
     padding:7px 11px;color:var(--fg);font:12px/1.2 var(--mono);outline:none;
     transition:border-color .2s,box-shadow .2s}
  #q:focus{border-color:rgba(111,195,255,.55);box-shadow:0 0 0 3px rgba(111,195,255,.08)}
  #q::placeholder{color:var(--dim2)}
  .btn{background:rgba(9,14,23,.86);border:1px solid var(--line);border-radius:9px;
       padding:7px 12px;color:var(--dim);font:11px/1 var(--mono);letter-spacing:.6px;
       cursor:pointer;transition:.18s;white-space:nowrap}
  .btn:hover{color:var(--fg);border-color:rgba(111,195,255,.45)}
  .btn.on{color:#06121f;background:var(--accent);border-color:var(--accent);font-weight:700}

  #detail{position:fixed;right:0;top:0;bottom:0;width:362px;z-index:8;
    background:linear-gradient(180deg,rgba(8,13,22,.985),rgba(5,9,16,.995));
    border-left:1px solid var(--line);
    will-change:transform;
    transform:translateX(102%);transition:transform .32s cubic-bezier(.22,.7,.2,1);
    display:flex;flex-direction:column;box-shadow:-30px 0 60px rgba(0,0,0,.45)}
  #detail.on{transform:none}
  .d-top{display:flex;align-items:center;gap:9px;padding:16px 18px 12px;
         border-bottom:1px solid var(--line)}
  .d-chip{font:10px/1 var(--mono);letter-spacing:1.2px;padding:4px 8px;border-radius:6px;
          border:1px solid currentColor;opacity:.9}
  .d-id{font:10px/1 var(--mono);color:var(--dim2);letter-spacing:1px}
  .d-x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:19px;
       cursor:pointer;line-height:1;padding:2px 4px}
  .d-x:hover{color:#fff}
  .d-body{padding:16px 18px;overflow:auto;flex:1}
  .d-text{font-size:14px;line-height:1.85;color:#e9f2fe;word-break:break-word;letter-spacing:.2px}
  .d-grid{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
  .d-k{font:10px/1.4 var(--mono);color:var(--dim2);letter-spacing:1px;text-transform:uppercase}
  .d-v{font:12px/1.6 var(--mono);color:#bfd3ea;margin-top:2px;word-break:break-all}
  .d-sec{margin-top:22px}
  .d-sec h4{font:10px/1 var(--mono);letter-spacing:1.4px;color:var(--dim);
            text-transform:uppercase;margin-bottom:9px;font-weight:500}
  .d-link{display:block;width:100%;text-align:left;background:rgba(255,255,255,.022);
    border:1px solid transparent;border-left:2px solid var(--dim2);border-radius:0 7px 7px 0;
    padding:7px 10px;margin-bottom:6px;color:#a9c0d8;font-size:12px;line-height:1.5;
    cursor:pointer;transition:.15s;word-break:break-word;font-family:inherit}
  .d-link:hover{background:rgba(111,195,255,.07);color:#e6f1ff}
  .d-link span{display:block;font:9px/1.6 var(--mono);color:var(--dim2);letter-spacing:1px}
  .d-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:5px;overflow:hidden}
  .d-bar i{display:block;height:100%;background:linear-gradient(90deg,#2b6ea8,var(--accent))}

  #tl{position:fixed;left:0;right:0;bottom:0;height:98px;z-index:6;
      background:linear-gradient(180deg,rgba(3,5,10,0),rgba(3,5,10,.9) 40%,#03050a);
      padding:22px 30px 16px;pointer-events:none}
  #tl .row{display:flex;align-items:flex-end;gap:14px;pointer-events:auto;height:100%}
  #tl .lab{font:10px/1.6 var(--mono);color:var(--dim2);letter-spacing:1px;white-space:nowrap;
           padding-bottom:10px}
  #tl .lab b{display:block;color:#a8c2dd;font-size:12px;letter-spacing:.4px}
  #hist{flex:1;height:46px;display:block;cursor:crosshair;touch-action:none}
  #play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
        background:rgba(9,14,23,.86);color:var(--dim);cursor:pointer;margin-bottom:6px;
        font-size:11px;line-height:1;flex:none}
  #play:hover{color:var(--accent);border-color:rgba(111,195,255,.5)}
  #play.on{color:#06121f;background:var(--accent);border-color:var(--accent)}
  .tip{position:fixed;left:0;bottom:3px;right:0;text-align:center;font:10px/1 var(--mono);
       color:#1e2a38;letter-spacing:1.8px;z-index:5;pointer-events:none}

  #hov{position:fixed;z-index:9;max-width:290px;padding:8px 11px;border-radius:9px;
       background:rgba(8,13,22,.95);border:1px solid rgba(111,195,255,.24);
       box-shadow:0 12px 34px rgba(0,0,0,.6);font-size:12px;line-height:1.6;color:#dbe9fa;
       pointer-events:none;opacity:0;transition:opacity .12s;word-break:break-word}
  #hov.on{opacity:1}
  #hov .m{font:9px/1.8 var(--mono);color:var(--dim);letter-spacing:1px}
  #toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-10px);z-index:10;
    padding:8px 16px;border-radius:9px;background:rgba(9,14,24,.95);
    border:1px solid rgba(111,195,255,.3);font:11px/1.4 var(--mono);color:#cfe4fa;
    opacity:0;transition:.25s;pointer-events:none;letter-spacing:.5px}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:820px){
    #ctrl{right:10px;top:10px;flex-wrap:wrap;justify-content:flex-end;max-width:66vw}
    #q{width:140px}
    #hud{left:14px;top:12px}
    .lg{width:100px}
    #detail{width:min(88vw,362px)}
    #tl{padding:16px 14px 12px}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="hud">
  <div class="brand"><i></i>记忆星图 <small>FISH · MEMORY</small></div>
  <div class="stats">
    <span><b id="sN">–</b> 节点</span>
    <span><b id="sE">–</b> 边</span>
    <span><b id="sH">–</b> 星团</span>
    <span><b id="sV" class="c">–</b> 可见</span>
  </div>
  <div id="legend"></div>
</div>

<div id="ctrl">
  <input id="q" placeholder="搜记忆 / 群号 / 分类…" spellcheck="false">
  <button class="btn on" id="b-lab">标签</button>
  <button class="btn" id="b-fit">适应</button>
  <button class="btn" id="b-re">重排</button>
</div>

<div id="detail">
  <div class="d-top">
    <span class="d-chip" id="d-chip">—</span>
    <span class="d-id" id="d-id"></span>
    <button class="d-x" id="d-x">×</button>
  </div>
  <div class="d-body" id="d-body"></div>
</div>

<div id="tl">
  <div class="row">
    <button id="play">▶</button>
    <div class="lab">时间窗<b id="t-range">—</b></div>
    <canvas id="hist"></canvas>
  </div>
</div>

<div id="hov"></div>
<div id="toast"></div>
<div class="tip">FISH_MEMORY · MEMORY.DB · READ ONLY</div>

<script>
(() => {
'use strict';

const KIND = {
  fact:      {c:'#8fd0ff', n:'事实'},
  episode:   {c:'#6ff0cf', n:'片段'},
  reflection:{c:'#b79cff', n:'反思'},
  lesson:    {c:'#ffcf8a', n:'教训'},
  skill:     {c:'#ff9fd0', n:'技能'},
};
const HUB = {grp:{c:'#3ef0a4', n:'群聊'}, dm:{c:'#ffb266', n:'私聊'}};
const RELNAME = {scope:'归属', co:'共注入', sim:'语义近'};
const CFG = {
  rep: 1350, repCut: 720*720,
  link:{scope:.040, co:.050, sim:.010},
  rest:{scope:38, co:28, sim:120},
  damp:.842, grav:.0020,
};
const $ = s => document.querySelector(s);
const cvs = $('#sky'), ctx = cvs.getContext('2d', {alpha:false});
const histC = $('#hist'), hctx = histC.getContext('2d');

let W=0, H=0, DPR=1;
let RAW=null, NODES=[], EDGES=[], HUBLIST=[], BYID=new Map();
let cam={x:0,y:0,k:.62};
let sel=null, hov=null, ptr=null, selNbrs=new Set();
let alpha=1, needFit=true, playing=false;
let t0=0, t1=0, tmin=0, tmax=0;
let qlow='', dragH=0, dragX0=0, histX0=0, histX1=0;
const view={kinds:new Set(Object.keys(KIND)), co:true, sim:true, labels:true, q:''};
const stars=[], neb=[];
let last=0;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const R=n=>Math.random()*n;
const fmtTime=ms=>{
  if(!ms) return '—';
  const d=new Date(ms), p=n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2400);
}
function hexA(hex,a){
  const h=hex.replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a.toFixed(3)})`;
}

/* ------------------------------------------------------------ 画布 */
// 缓冲区只在窗口停手后重建：拖窗口时用 CSS 拉伸旧缓冲，避免每帧重建
// 大 canvas 导致合成器拿到错位的旧 tile（右侧/底部出现放大残影）。
let bufTimer = 0, ctxDpr = 0;
function allocBuffer(){
  clearTimeout(bufTimer);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, cvs.clientWidth || window.innerWidth);
  const h = Math.max(1, cvs.clientHeight || window.innerHeight);
  const bw = Math.max(1, Math.floor(w*dpr)), bh = Math.max(1, Math.floor(h*dpr));
  if (cvs.width === bw && cvs.height === bh && ctxDpr === dpr) return;
  DPR = dpr; ctxDpr = dpr; W = w; H = h;
  cvs.width = bw; cvs.height = bh;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars(); buildNebula();
  sizeHist();
  if (NODES.length) fit(true);
}
function sizeHist(){
  const w = Math.max(1, histC.clientWidth), h = Math.max(1, histC.clientHeight);
  histC.width = Math.floor(w*DPR); histC.height = Math.floor(h*DPR);
  hctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawHist();
}
function queueResize(){
  clearTimeout(bufTimer);
  if (Math.min(window.devicePixelRatio||1, 2) !== ctxDpr) { allocBuffer(); return; }
  bufTimer = setTimeout(allocBuffer, 120);
}
// 页面缩放（Ctrl+滚轮/系统缩放）会改 DPR，单独盯一下，避免画面被拉伸成糊的
let dprMq = null;
function watchDpr(){
  const dpr = window.devicePixelRatio || 1;
  if (dprMq && dprMq.removeEventListener) dprMq.removeEventListener('change', onDpr);
  dprMq = window.matchMedia(`(resolution: ${dpr}dppx)`);
  if (dprMq.addEventListener) dprMq.addEventListener('change', onDpr);
}
function onDpr(){ watchDpr(); allocBuffer(); }
function buildStars(){
  stars.length=0;
  const n = Math.round(W*H/5000);
  for(let i=0;i<n;i++) stars.push({
    x:Math.random(), y:Math.random(), r:R(1.15)+.2,
    a:.10+Math.random()*.55, f:.6+Math.random()*2.4, p:R(6.28),
    hue: Math.random()<.13 ? 205 : (Math.random()<.09 ? 30 : 0),
  });
}
function buildNebula(){
  neb.length=0;
  neb.push({x:.28,y:.22,r:.70,c:'rgba(18,48,98,.28)'});
  neb.push({x:.78,y:.64,r:.62,c:'rgba(44,16,68,.26)'});
  neb.push({x:.5,y:.5,r:.95,c:'rgba(7,20,40,.42)'});
}

/* ------------------------------------------------------------ 数据 */
async function load(keep){
  let data;
  try{
    const r = await fetch('/api/graph', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    data = await r.json();
  }catch(e){ toast('接口读取失败：'+e.message); return; }
  if(!data || !data.nodes || !data.nodes.length){ toast('没有记忆数据'); return; }
  RAW = data;
  const pos = new Map(NODES.map(n=>[n.id,[n.x,n.y]]));
  build(pos, keep);
  document.title = `肥鱼 · 记忆星图 · ${RAW.meta.memories}`;
  updateStats(true);
  if(!keep) fit(true);
  drawHist();
}

function build(keepPos, keep){
  const M = RAW.meta;
  tmin = M.t0 || Date.now()-86400e3; tmax = M.t1 || Date.now();
  if(!keep){ t0 = tmin; t1 = tmax; }
  BYID = new Map(); NODES = []; HUBLIST = [];
  for(const raw of RAW.nodes){
    const isHub = raw.t==='hub';
    const old = keepPos.get(raw.id);
    const n = Object.assign({}, raw, {vx:0, vy:0, deg:0, ph:R(6.28), sp:.45+Math.random()});
    if(old){ n.x=old[0]; n.y=old[1]; }
    else{
      const a=R(6.2832), rad=140+Math.random()*640;
      n.x=Math.cos(a)*rad; n.y=Math.sin(a)*rad;
    }
    n.r = isHub ? 7+Math.sqrt(raw.n||1)*.85
                : 2.3+(raw.imp||0)*5.2+Math.min(Math.sqrt(raw.acc||0),4)*.85;
    BYID.set(n.id,n); NODES.push(n);
    if(isHub) HUBLIST.push(n);
  }
  EDGES = [];
  for(const e of (RAW.edges||[])){
    const a=BYID.get(e.s), b=BYID.get(e.t);
    if(!a||!b) continue;
    a.deg++; b.deg++;
    EDGES.push({a,b,r:e.r,w:e.w||1});
  }
  if(!keep){ reseed(); }
  alpha = 1;
  for(let i=0;i<520;i++) step();
  alpha = .06;
  sel=null; selNbrs=new Set(); $('#detail').classList.remove('on');
}
function reseed(){
  NODES.forEach((n,i)=>{
    const a=(i/NODES.length)*6.2832+R(.7), rad=140+Math.random()*660;
    n.x=Math.cos(a)*rad; n.y=Math.sin(a)*rad; n.vx=n.vy=0;
  });
}

/* ------------------------------------------------------------ 力学 */
function step(){
  const N=NODES;
  for(let i=0;i<N.length;i++){
    const a=N[i];
    for(let j=i+1;j<N.length;j++){
      const b=N[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      let d2=dx*dx+dy*dy;
      if(d2>CFG.repCut) continue;
      if(d2<36){ d2=36; dx+=R(1)-.5; dy+=R(1)-.5; }
      const f=alpha*CFG.rep/d2, inv=1/Math.sqrt(d2), ux=dx*inv, uy=dy*inv;
      a.vx-=ux*f; a.vy-=uy*f; b.vx+=ux*f; b.vy+=uy*f;
    }
  }
  for(const e of EDGES){
    const {a,b,r}=e;
    const dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.hypot(dx,dy)||1;
    const f=(d-(CFG.rest[r]||40))*(CFG.link[r]||.02)*alpha;
    const ux=dx/d, uy=dy/d;
    a.vx+=ux*f; a.vy+=uy*f; b.vx-=ux*f; b.vy-=uy*f;
  }
  for(const n of NODES){
    n.vx-=n.x*CFG.grav*alpha; n.vy-=n.y*CFG.grav*alpha;
    n.vx*=CFG.damp; n.vy*=CFG.damp;
    const sp=Math.hypot(n.vx,n.vy), mx=n.t==='hub'?7:11;
    if(sp>mx){ n.vx*=mx/sp; n.vy*=mx/sp; }
    n.x+=n.vx; n.y+=n.vy;
  }
}

/* ------------------------------------------------------------ 视图 */
const w2s=(x,y)=>[(x-cam.x)*cam.k+W/2, (y-cam.y)*cam.k+H/2];
const s2w=(sx,sy)=>[(sx-W/2)/cam.k+cam.x, (sy-H/2)/cam.k+cam.y];
const panelW=()=>($('#detail').classList.contains('on')?362:0);
function fit(instant){
  const vis=visibleNodes(); if(!vis.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of vis){
    if(n.x<x0)x0=n.x; if(n.x>x1)x1=n.x;
    if(n.y<y0)y0=n.y; if(n.y>y1)y1=n.y;
  }
  const bw=Math.max(x1-x0,240), bh=Math.max(y1-y0,240);
  const pw=panelW();
  const k=clamp(Math.min(((W-pw)*.82)/bw,(H*.70)/bh), .10, 2.2);
  const cx=(x0+x1)/2 + pw/(2*k), cy=(y0+y1)/2;
  if(instant){ cam.k=k; cam.x=cx; cam.y=cy; return; }
  const s={k:cam.k,x:cam.x,y:cam.y};
  tween(380, p=>{ cam.k=s.k+(k-s.k)*p; cam.x=s.x+(cx-s.x)*p; cam.y=s.y+(cy-s.y)*p; });
}
const tweens={};
function tween(dur, fn){
  const id=Math.random();
  tweens[id]={t0:performance.now(), dur, fn};
  requestAnimationFrame(function loop(){
    if(!tweens[id]) return;
    const p=clamp((performance.now()-tweens[id].t0)/dur,0,1), e=1-Math.pow(1-p,3);
    tweens[id].fn(e);
    if(p<1) requestAnimationFrame(loop); else delete tweens[id];
  });
}

/* ------------------------------------------------------------ 过滤 */
function nodeVisible(n){
  if(n.t==='hub') return true;
  if(n.st!=='active' && !view.archived) return false;
  if(!view.kinds.has(n.kind)) return false;
  if(n.ts && (n.ts<t0 || n.ts>t1)) return false;
  return true;
}
function visibleNodes(){ return NODES.filter(nodeVisible); }
function matches(n){
  if(!qlow) return true;
  return (n.text||'').toLowerCase().includes(qlow)
      || (n.cat||'').toLowerCase().includes(qlow)
      || (n.kind||'').toLowerCase().includes(qlow)
      || (n.key||'').includes(qlow);
}

/* ------------------------------------------------------------ 绘制 */
function draw(ts){
  const t=ts*0.001;
  ctx.fillStyle='#03050a'; ctx.fillRect(0,0,W,H);
  drawNebula();
  drawStars(t);

  const vis=visibleNodes();
  const vset=new Set(vis.map(n=>n.id));
  const selN = sel ? BYID.get(sel) : null;
  const k=cam.k;

  ctx.save();
  ctx.translate(W/2,H/2); ctx.scale(k,k); ctx.translate(-cam.x,-cam.y);

  // 星团辉光（每个会话一圈淡淡的星云）
  for(const h of HUBLIST){
    const c=(HUB[h.hk]||HUB.dm).c;
    const R0=Math.max(80, Math.sqrt(h.n||1)*46);
    const g=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,R0);
    g.addColorStop(0,hexA(c,.055)); g.addColorStop(.55,hexA(c,.022)); g.addColorStop(1,hexA(c,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(h.x,h.y,R0,0,6.2832); ctx.fill();
  }

  const lineW=1/k;
  // 三类边（批量）
  for(const r of ['scope','sim','co']){
    if(r==='co' && !view.co) continue;
    if(r==='sim' && !view.sim) continue;
    ctx.beginPath();
    for(const e of EDGES){
      if(e.r!==r) continue;
      if(!vset.has(e.a.id) || !vset.has(e.b.id)) continue;
      ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(e.b.x,e.b.y);
    }
    if(r==='scope'){ ctx.strokeStyle='rgba(86,124,178,.16)'; ctx.lineWidth=lineW*.9; ctx.setLineDash([]); }
    if(r==='sim'){ ctx.strokeStyle='rgba(150,120,255,.14)'; ctx.lineWidth=lineW*.8; ctx.setLineDash([3/k,4/k]); }
    if(r==='co'){ ctx.strokeStyle='rgba(110,180,255,.22)'; ctx.lineWidth=lineW*1.0; ctx.setLineDash([]); }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 选中/悬停的连线
  const hiId = sel||hov;
  if(hiId){
    const n=BYID.get(hiId);
    if(n){
      ctx.beginPath();
      for(const e of EDGES){
        const o = e.a===n ? e.b : (e.b===n ? e.a : null);
        if(!o) continue;
        ctx.moveTo(n.x,n.y); ctx.lineTo(o.x,o.y);
      }
      ctx.strokeStyle='rgba(140,205,255,.45)'; ctx.lineWidth=lineW*1.25; ctx.stroke();
    }
  }

  // 光晕
  ctx.globalCompositeOperation='lighter';
  for(const n of vis){
    const dim=dimFactor(n,selN), br=1+Math.sin(t*n.sp+n.ph)*.035;
    const rr=n.r*br, R0=rr*(n.t==='hub'?5.2:5.0);
    const col=n.t==='hub'?(HUB[n.hk]||HUB.dm).c:(KIND[n.kind]||KIND.fact).c;
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,R0);
    g.addColorStop(0,hexA(col,.34*dim));
    g.addColorStop(.30,hexA(col,.10*dim));
    g.addColorStop(1,hexA(col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,R0,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  for(const n of vis){
    const dim=dimFactor(n,selN), br=1+Math.sin(t*n.sp+n.ph)*.035, rr=n.r*br;
    if(n.t==='hub'){
      const c=(HUB[n.hk]||HUB.dm).c;
      ctx.beginPath(); ctx.arc(n.x,n.y,rr+5/k,0,6.2832);
      ctx.strokeStyle=hexA(c,.30*dim); ctx.lineWidth=1.1/k; ctx.stroke();
      ctx.beginPath(); ctx.arc(n.x,n.y,rr,0,6.2832);
      ctx.fillStyle=hexA(c,.92*dim); ctx.fill();
      ctx.beginPath(); ctx.arc(n.x,n.y,rr*.38,0,6.2832);
      ctx.fillStyle=hexA('#ffffff',.95*dim); ctx.fill();
      // 轨道环
      ctx.beginPath(); ctx.arc(n.x,n.y,rr*2.6,0,6.2832);
      ctx.strokeStyle=hexA(c,.10*dim); ctx.lineWidth=.8/k;
      ctx.setLineDash([1.5/k,7/k]); ctx.stroke(); ctx.setLineDash([]);
    }else{
      const c=(KIND[n.kind]||KIND.fact).c;
      ctx.beginPath(); ctx.arc(n.x,n.y,rr,0,6.2832);
      ctx.fillStyle=hexA(c,.95*dim); ctx.fill();
      ctx.beginPath(); ctx.arc(n.x,n.y,rr*.42,0,6.2832);
      ctx.fillStyle=hexA('#ffffff',.9*dim); ctx.fill();
      if(n.st!=='active'){
        ctx.beginPath(); ctx.arc(n.x,n.y,rr+1.8/k,0,6.2832);
        ctx.strokeStyle=hexA('#6d7f93',.55*dim); ctx.lineWidth=1/k; ctx.stroke();
      }
    }
  }

  if(selN){
    const rr=selN.r, c=selN.t==='hub'?(HUB[selN.hk]||HUB.dm).c:(KIND[selN.kind]||KIND.fact).c;
    ctx.beginPath(); ctx.arc(selN.x,selN.y,rr+9/k,0,6.2832);
    ctx.strokeStyle=hexA(c,.9); ctx.lineWidth=1.2/k; ctx.stroke();
    ctx.beginPath(); ctx.arc(selN.x,selN.y,rr+17/k,0,6.2832);
    ctx.strokeStyle=hexA(c,.20); ctx.lineWidth=1/k;
    ctx.setLineDash([2/k,6/k]); ctx.stroke(); ctx.setLineDash([]);
  }

  if(view.labels) drawLabels(vis, selN, k);

  ctx.restore();
}

let labelSet=new Set(), labelStamp=0;
const lblScore=n=>(n.imp||0)*3+Math.log1p(n.acc||0)*1.3+(n.deg||0)*.04;
function drawLabels(vis, selN, k){
  const showAll = k>=1.5;
  if(!showAll && performance.now()-labelStamp>600){
    labelStamp=performance.now();
    const ranked=vis.filter(n=>n.t==='mem').sort((a,b)=>lblScore(b)-lblScore(a));
    const budget=Math.round(clamp(54-(k-.55)*50, 16, 54));
    labelSet=new Set(ranked.slice(0,budget).map(n=>n.id));
  }
  // 候选：hub 永远标；其余按分数高低，先到先得
  const cands=[];
  for(const n of vis){
    const isHub=n.t==='hub';
    const near = n===selN || (hov&&BYID.get(hov)===n);
    if(!isHub && !near && !(showAll||labelSet.has(n.id))) continue;
    if(dimFactor(n,selN)<.28) continue;
    cands.push({n, isHub, near, s:isHub?1e9:lblScore(n)});
  }
  cands.sort((a,b)=>b.s-a.s);
  const boxes=[];
  for(const cd of cands){
    const {n,isHub,near}=cd;
    const dim=dimFactor(n,selN);
    const fs=(isHub?11.5:9.8)/Math.max(k,.92);
    ctx.font=`${isHub?600:400} ${fs}px ui-monospace,Consolas,monospace`;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    let label = n.text || '';
    if(isHub) label = `${n.hk==='grp'?'群':'私'} ${n.key}`;
    const maxC = isHub?18:15;
    if(label.length>maxC) label=label.slice(0,maxC-1)+'…';
    const w=ctx.measureText(label).width;
    const sx=w2s(n.x,n.y)[0];
    let tx=n.x+(n.r+8/k);
    if(sx+w*k+14 > W) tx=n.x-(n.r+8/k)-w;
    const ty=n.y+fs*.36;
    const p0=w2s(tx, ty-fs*.9), p1=w2s(tx+w, ty+fs*.9);
    const R0=[p0[0],p0[1],p1[0],p1[1]];
    let clash=false;
    for(const b of boxes){
      if(R0[0]<b[2] && R0[2]>b[0] && R0[1]<b[3] && R0[3]>b[1]){ clash=true; break; }
    }
    if(clash && !near) continue;
    boxes.push(R0);
    if(isHub){
      const c=(HUB[n.hk]||HUB.dm).c;
      ctx.fillStyle='rgba(3,6,12,.66)';
      ctx.fillRect(tx-3/k,ty-fs*.9, w+6/k, fs*1.75);
      ctx.fillStyle=hexA(c,.96*dim);
      ctx.fillText(label,tx,ty);
      ctx.font=`400 ${9.5/Math.max(k,.92)}px ui-monospace,Consolas,monospace`;
      ctx.fillStyle=hexA(c,.50*dim);
      ctx.fillText(`· ${n.n} 条`,tx,ty+12/k);
    }else{
      ctx.fillStyle=hexA(near?'#eaf4ff':'#b6cde6', near ? .95 : Math.min(.88, .66*dim+.18));
      ctx.fillText(label,tx,ty);
    }
  }
}

function dimFactor(n, selN){
  let dim=1;
  if(n.t==='mem' && n.st!=='active') dim*=.42;
  if(qlow) dim *= matches(n) ? 1 : .10;
  if(selN && selN!==n){
    const linked = selNbrs.has(n.id);
    const rel = n.t==='mem' && n.sc===selN.id;
    const rel2 = selN.t==='hub' && n.t==='mem' && n.sc===selN.id;
    dim *= (linked||rel||rel2) ? .95 : .16;
  }
  return dim;
}

function drawStars(t){
  for(const s of stars){
    let x=(s.x*W+cam.x*cam.k*.04)%W; if(x<0)x+=W;
    let y=(s.y*H+cam.y*cam.k*.04)%H; if(y<0)y+=H;
    const a=s.a*(.62+.38*Math.sin(t*s.f+s.p));
    ctx.fillStyle = s.hue===205?`rgba(150,205,255,${a})`
                  : s.hue===30?`rgba(255,205,150,${a*.8})`
                  : `rgba(210,225,245,${a})`;
    ctx.beginPath(); ctx.arc(x,y,s.r,0,6.2832); ctx.fill();
  }
}
function drawNebula(){
  for(const n of neb){
    const g=ctx.createRadialGradient(n.x*W,n.y*H,0,n.x*W,n.y*H,n.r*Math.max(W,H));
    g.addColorStop(0,n.c); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
}

/* ------------------------------------------------------------ 时间轴 */
const histW=()=>Math.max(1,histC.clientWidth);
const timeToX=ms=>8+(ms-tmin)/Math.max(1,tmax-tmin)*(histW()-16);
const xToTime=x=>tmin+clamp((x-8)/(histW()-16),0,1)*(tmax-tmin);

function drawHist(){
  const w=histC.clientWidth, h=histC.clientHeight;
  if(!w||!h) return;
  hctx.clearRect(0,0,w,h);
  const mem = RAW ? RAW.nodes.filter(x=>x.t==='mem'&&x.ts) : [];
  if(mem.length){
    const bins=Math.max(24, Math.floor((w-16)/6));
    const counts=new Array(bins).fill(0), span=Math.max(1,tmax-tmin);
    let mx=1;
    for(const m of mem){
      const i=clamp(Math.floor((m.ts-tmin)/span*bins),0,bins-1);
      counts[i]++; if(counts[i]>mx) mx=counts[i];
    }
    const bw=(w-16)/bins, base=h-6;
    for(let i=0;i<bins;i++){
      const c=counts[i]; if(!c) continue;
      const bh=Math.max(2,(c/mx)*(h-14));
      const x=8+i*bw, tt=tmin+(i+.5)/bins*span;
      hctx.fillStyle = (tt>=t0&&tt<=t1) ? 'rgba(111,195,255,.60)' : 'rgba(90,120,160,.18)';
      hctx.fillRect(x+bw*.18, base-bh, Math.max(1.4,bw*.64), bh);
    }
  }
  const x0=timeToX(t0), x1=timeToX(t1);
  histX0=x0; histX1=x1;
  hctx.fillStyle='rgba(111,195,255,.055)'; hctx.fillRect(x0,0,Math.max(0,x1-x0),h);
  hctx.strokeStyle='rgba(111,195,255,.5)'; hctx.lineWidth=1;
  hctx.beginPath();
  hctx.moveTo(x0,0); hctx.lineTo(x0,h); hctx.moveTo(x1,0); hctx.lineTo(x1,h); hctx.stroke();
  hctx.fillStyle='rgba(140,210,255,.9)';
  for(const x of [x0,x1]){ hctx.beginPath(); hctx.arc(x,h-3,2.6,0,6.2832); hctx.fill(); }
  $('#t-range').textContent = fmtTime(Math.round(t0))+' → '+fmtTime(Math.round(t1));
  if(RAW) $('#sV').textContent = visibleNodes().filter(n=>n.t==='mem').length;
}

histC.addEventListener('pointerdown', e=>{
  const r=histC.getBoundingClientRect(), x=e.clientX-r.left;
  const d0=Math.abs(x-histX0), d1=Math.abs(x-histX1);
  if(d0<12 && d0<=d1) dragH=1;
  else if(d1<12) dragH=2;
  else if(x>histX0 && x<histX1) dragH=3;
  else {
    dragH=3;
    const w=t1-t0, mid=xToTime(x);
    t0=clamp(mid-w/2,tmin,tmax-w); t1=t0+w;
    dragH=0;
  }
  dragX0=x;
  histC.setPointerCapture(e.pointerId);
  drawHist();
});
histC.addEventListener('pointermove', e=>{
  if(!dragH) return;
  const r=histC.getBoundingClientRect(), x=e.clientX-r.left;
  const minWin=3600e3;
  if(dragH===1){ t0=clamp(xToTime(x), tmin, t1-minWin); }
  else if(dragH===2){ t1=clamp(xToTime(x), t0+minWin, tmax); }
  else if(dragH===3){
    const span=Math.max(1,histW()-16);
    const dt=(x-dragX0)/span*(tmax-tmin);
    const w=t1-t0;
    let a=t0+dt, b=t1+dt;
    if(a<tmin){ b+=tmin-a; a=tmin; }
    if(b>tmax){ a-=b-tmax; b=tmax; }
    t0=clamp(a,tmin,tmax); t1=clamp(b,tmin,tmax);
    dragX0=x;
  }
  drawHist();
});
window.addEventListener('pointerup', ()=>{ dragH=0; });

$('#play').addEventListener('click', ()=>{
  playing=!playing;
  $('#play').classList.toggle('on',playing);
  $('#play').textContent = playing?'❚❚':'▶';
  if(!playing) return;
  const from = t0>=tmax-1000 ? tmin : t0;
  const dur=9000, start=performance.now();
  t0=tmin;
  (function go(){
    if(!playing) return;
    const p=clamp((performance.now()-start)/dur,0,1);
    t1 = from+(tmax-from)*p;
    drawHist();
    if(p<1) requestAnimationFrame(go);
    else { playing=false; $('#play').classList.remove('on'); $('#play').textContent='▶'; }
  })();
});

/* ------------------------------------------------------------ 交互 */
let hitTimer=0;
cvs.addEventListener('pointerdown', e=>{
  ptr={x:e.clientX,y:e.clientY,moved:false};
  cvs.classList.add('drag'); cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove', e=>{
  if(ptr){
    const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y;
    if(Math.abs(dx)+Math.abs(dy)>3) ptr.moved=true;
    if(ptr.moved){
      cam.x-=dx/cam.k; cam.y-=dy/cam.k;
      ptr.x=e.clientX; ptr.y=e.clientY;
      $('#hov').classList.remove('on');
      return;
    }
  }
  hoverAt(e.clientX,e.clientY);
});
cvs.addEventListener('pointerup', e=>{
  cvs.classList.remove('drag');
  const moved = ptr && ptr.moved;
  ptr=null;
  if(moved) return;
  const n=pick(e.clientX,e.clientY);
  select(n?n.id:null);
  if(n) focusOn(n.id);
});
cvs.addEventListener('pointerleave', ()=>{ $('#hov').classList.remove('on'); hov=null; });
cvs.addEventListener('wheel', e=>{
  e.preventDefault();
  const [wx,wy]=s2w(e.clientX,e.clientY);
  cam.k=clamp(cam.k*Math.exp(-e.deltaY*0.0016),.10,4.2);
  const [nx,ny]=s2w(e.clientX,e.clientY);
  cam.x+=wx-nx; cam.y+=wy-ny;
},{passive:false});

function pick(sx,sy){
  let best=null, bd=1e9;
  for(const n of NODES){
    if(!nodeVisible(n)) continue;
    const [x,y]=w2s(n.x,n.y);
    const d=Math.hypot(x-sx,y-sy);
    const rr=Math.max(7,n.r*cam.k+5);
    if(d<rr && d<bd){ bd=d; best=n; }
  }
  return best;
}
function hoverAt(sx,sy){
  const n=pick(sx,sy);
  const id=n?n.id:null;
  const box=$('#hov');
  if(id!==hov){
    hov=id;
    if(!n){ box.classList.remove('on'); return; }
    const c=n.t==='hub'?(HUB[n.hk]||HUB.dm):(KIND[n.kind]||KIND.fact);
    box.innerHTML = n.t==='hub'
      ? `<div class="m" style="color:${c.c}">${n.hk==='grp'?'群聊':'私聊'} · ${n.n} 条记忆</div>${esc(n.key)}`
      : `<div class="m" style="color:${c.c}">${esc(c.n)} · ${esc(n.cat||'general')} · ${esc(n.st)}</div>${esc(n.text)}<div class="m">重要度 ${(n.imp||0).toFixed(2)} · 取用 ${n.acc} 次</div>`;
    box.classList.add('on');
  }
  if(!n) return;
  box.style.left=Math.min(sx+16,W-310)+'px';
  box.style.top=Math.min(sy+16,H-120)+'px';
}

/* ------------------------------------------------------------ 详情 */
function select(id){
  sel=id;
  selNbrs=new Set();
  const d=$('#detail');
  const n = id?BYID.get(id):null;
  if(!n){ d.classList.remove('on'); return; }
  for(const e of EDGES){
    if(e.a===n) selNbrs.add(e.b.id);
    else if(e.b===n) selNbrs.add(e.a.id);
  }
  d.classList.add('on');
  const isHub=n.t==='hub';
  const c=isHub?(HUB[n.hk]||HUB.dm):(KIND[n.kind]||KIND.fact);
  const chip=$('#d-chip');
  chip.textContent = isHub ? (n.hk==='grp'?'群聊星团':'私聊星团') : c.n;
  chip.style.color = c.c;
  $('#d-id').textContent = isHub ? 'SCOPE '+n.key : n.id.toUpperCase();

  const nb=[];
  for(const e of EDGES){
    if(e.a===n) nb.push({o:e.b,r:e.r,w:e.w});
    else if(e.b===n) nb.push({o:e.a,r:e.r,w:e.w});
  }
  nb.sort((x,y)=>y.w-x.w);

  let html='';
  if(isHub){
    html += `<div class="d-text">QQ ${esc(n.key)} · 这个会话里攒下 ${n.n} 条记忆</div>`;
    html += `<div class="d-grid">
      <div><div class="d-k">类型</div><div class="d-v">${n.hk==='grp'?'群聊':'私聊'}</div></div>
      <div><div class="d-k">记忆</div><div class="d-v">${n.n} 条</div></div></div>`;
  }else{
    html += `<div class="d-text">${esc(n.text)}</div>`;
    html += `<div class="d-grid">
      <div><div class="d-k">类型</div><div class="d-v">${esc(c.n)}</div></div>
      <div><div class="d-k">分类</div><div class="d-v">${esc(n.cat||'—')}</div></div>
      <div><div class="d-k">重要度</div><div class="d-v">${(n.imp||0).toFixed(2)}
        <div class="d-bar"><i style="width:${Math.round((n.imp||0)*100)}%"></i></div></div></div>
      <div><div class="d-k">取用次数</div><div class="d-v">${n.acc}</div></div>
      <div><div class="d-k">写入</div><div class="d-v">${fmtTime(n.ts)}</div></div>
      <div><div class="d-k">状态</div><div class="d-v">${esc(n.st)}</div></div>
    </div>`;
  }
  const groups={};
  for(const x of nb) (groups[x.r]||(groups[x.r]=[])).push(x);
  for(const r of ['co','sim','scope']){
    const all=groups[r]||[];
    if(!all.length) continue;
    html += `<div class="d-sec"><h4>${RELNAME[r]} · ${all.length}</h4>`;
    for(const x of all.slice(0,12)){
      const o=x.o;
      const label = o.t==='hub' ? `${o.hk==='grp'?'群':'私'} ${o.key}` : ((o.text||'').slice(0,42)||o.id);
      const meta = o.t==='hub' ? `${o.n} 条` : `${(KIND[o.kind]||KIND.fact).n} · ${fmtTime(o.ts)}`;
      const col = o.t==='hub'?(HUB[o.hk]||HUB.dm).c:(KIND[o.kind]||KIND.fact).c;
      html += `<button class="d-link" data-go="${o.id}" style="border-left-color:${col}">
        ${esc(label)}<span>${esc(meta)}</span></button>`;
    }
    html += '</div>';
  }
  $('#d-body').innerHTML=html;
  $('#d-body').querySelectorAll('[data-go]').forEach(b=>{
    b.onclick=()=>{ const id2=b.dataset.go; select(id2); focusOn(id2); };
  });
}
function focusOn(id){
  const n=BYID.get(id); if(!n) return;
  const tk=clamp(cam.k<.85?1.1:cam.k,.35,2.2);
  const tx=n.x + panelW()/(2*tk);
  const s={k:cam.k,x:cam.x,y:cam.y};
  tween(520,p=>{ cam.k=s.k+(tk-s.k)*p; cam.x=s.x+(tx-s.x)*p; cam.y=s.y+(n.y-s.y)*p; });
}
$('#d-x').onclick=()=>select(null);
window.addEventListener('keydown', e=>{
  if(e.key==='Escape') select(null);
  if(e.key==='f' && !e.metaKey && !e.ctrlKey) fit(false);
});

/* ------------------------------------------------------------ HUD */
function updateStats(rebuild){
  const M=RAW?RAW.meta:{memories:0,hubs:0,edges:0};
  $('#sN').textContent=M.memories;
  $('#sE').textContent=EDGES.length;
  $('#sH').textContent=M.hubs;
  $('#sV').textContent=visibleNodes().filter(n=>n.t==='mem').length;
  const byKind={}, byHub={};
  for(const n of RAW.nodes){
    if(n.t==='mem') byKind[n.kind]=(byKind[n.kind]||0)+1;
  }
  for(const n of HUBLIST) byHub[n.hk]=(byHub[n.hk]||0)+1;
  let html='';
  for(const [k,v] of Object.entries(KIND)){
    html += `<div class="lg ${view.kinds.has(k)?'':'off'}" data-kind="${k}">
      <u style="color:${v.c}"></u><s>${v.n}</s><em>${byKind[k]||0}</em></div>`;
  }
  for(const [k,v] of Object.entries(HUB)){
    html += `<div class="lg"><u style="color:${v.c}"></u><s>${v.n}</s><em>${byHub[k]||0}</em></div>`;
  }
  html += `<div class="lg hr ${view.co?'':'off'}" data-edge="co" style="color:#6eb4ff">
    <u style="color:#6eb4ff"></u><s>共注入</s><em>${EDGES.filter(e=>e.r==='co').length}</em></div>`;
  html += `<div class="lg ${view.sim?'':'off'}" data-edge="sim" style="color:#9a78ff">
    <u style="color:#9a78ff"></u><s>语义近</s><em>${EDGES.filter(e=>e.r==='sim').length}</em></div>`;
  $('#legend').innerHTML=html;
  $('#legend').querySelectorAll('[data-kind]').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.kind;
      if(view.kinds.has(k)){ if(view.kinds.size>1) view.kinds.delete(k); }
      else view.kinds.add(k);
      updateStats();
    };
  });
  $('#legend').querySelectorAll('[data-edge]').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.edge;
      view[k]=!view[k];
      updateStats();
    };
  });
}

$('#b-lab').onclick=e=>{ view.labels=!view.labels; e.currentTarget.classList.toggle('on',view.labels); };
$('#b-fit').onclick=()=>fit(false);
$('#b-re').onclick=()=>{ reseed(); alpha=1; for(let i=0;i<520;i++) step(); alpha=.06; fit(false); };
$('#q').oninput=e=>{ view.q=e.target.value.trim(); qlow=view.q.toLowerCase(); };
$('#q').addEventListener('keydown', e=>{
  if(e.key!=='Enter'||!view.q) return;
  const hit=NODES.find(n=>n.t==='mem'&&nodeVisible(n)&&matches(n));
  if(hit){ select(hit.id); focusOn(hit.id); }
  else toast('没有匹配的记忆');
});

/* ------------------------------------------------------------ 主循环 */
function loop(ts){ requestAnimationFrame(loop); window.__frames=(window.__frames||0)+1; draw(ts); }
window.addEventListener('resize', queueResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);
window.addEventListener('focus', ()=>{ if (ctxDpr !== Math.min(window.devicePixelRatio||1,2)) allocBuffer(); });
document.addEventListener('visibilitychange', ()=>{ last=0; });
watchDpr();
setInterval(()=>{ if(playing) drawHist(); }, 900);

// 调试钩子（只读，方便远程核对）
window.addEventListener('error', e=>{ window.__starErr = String(e.message||e.error); });
window.__star = {
  nodes:()=>NODES.length, edges:()=>EDGES.length,
  select:(id)=>select(id), fit:(i)=>fit(i!==false), focus:(id)=>focusOn(id),
  search:(q)=>{ view.q=q; qlow=(q||'').toLowerCase(); },
  pickAt:(x,y)=>{ const n=pick(x,y); return n&&n.id; },
  stats:()=>({nodes:NODES.length, edges:EDGES.length, hubs:HUBLIST.length,
              k:cam.k, x:cam.x, y:cam.y, visible:visibleNodes().length,
              bbox:(()=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;
                for(const n of NODES){a=Math.min(a,n.x);b=Math.min(b,n.y);
                c=Math.max(c,n.x);d=Math.max(d,n.y);} return [Math.round(a),Math.round(b),Math.round(c),Math.round(d)];})()}),
  meta:()=>RAW&&RAW.meta,
};

allocBuffer();
load(false);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
